[workspace]
resolver = "2"
members = ["crates/lc-core", "crates/lc-node", "crates/lc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/FTHTrading/genesis402-agent-kit"
rust-version = "1.88"

[workspace.dependencies]
lc-core = { path = "crates/lc-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
k256 = { version = "0.13", features = ["ecdsa"] }
argon2 = "0.5"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
