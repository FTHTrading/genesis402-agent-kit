name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MCP server (quote-only, nothing is signed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          GENESIS402_LIVE: "0"

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t genesis402-mcp .
      - name: tools/list over stdio
        run: |
          { printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 20; } \
            | timeout 40 docker run --rm -i genesis402-mcp | tee out.jsonl || true
          grep -q '"genesis402_catalog"' out.jsonl

  legacychain:
    name: LegacyChain (Rust) tests + three-validator devnet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacychain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo test --locked
      - name: End-to-end devnet (money, sealed contracts, agent escrow, RWA, x402 + MPP deposits)
        run: timeout 600 demo/devnet.sh

  legacychain-docker:
    name: LegacyChain node image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t legacychain ./legacychain
      - run: docker run --rm --entrypoint lc legacychain --version
