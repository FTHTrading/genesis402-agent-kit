name: release-mcp

# Releases mcp/ (genesis402-mcp): npm via the OIDC Trusted Publisher, then the MCP Registry via
# mcp-publisher's github-oidc login (namespace io.github.FTHTrading). No tokens stored anywhere.
# Trigger: push tag vX.Y.Z matching mcp/package.json + mcp/server.json, or run manually (idempotent).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm trusted publishing + provenance, and MCP Registry github-oidc

concurrency:
  group: release-mcp
  cancel-in-progress: false

jobs:
  publish:
    name: npm + MCP Registry
    runs-on: ubuntu-latest
    environment: release-mcp   # matches the npm Trusted Publisher entry
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: npm >= 11.5.1 (trusted publishing needs it)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm test
        env:
          GENESIS402_LIVE: "0"

      - name: versions must agree (package.json, server.json x2, tag)
        id: ver
        run: |
          PKG=$(node -p "require('./package.json').version")
          SJ=$(node -p "require('./server.json').version")
          SJP=$(node -p "require('./server.json').packages[0].version")
          echo "package=$PKG server.json=$SJ server.json.packages[0]=$SJP ref=$GITHUB_REF_NAME"
          test "$PKG" = "$SJ" && test "$PKG" = "$SJP"
          if [ "${{ github.ref_type }}" = "tag" ]; then test "$PKG" = "${GITHUB_REF_NAME#v}"; fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: already on npm?
        id: npmcheck
        run: |
          if npm view "genesis402-mcp@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: npm publish (OIDC, provenance)
        if: steps.npmcheck.outputs.exists == 'false'
        run: npm publish --provenance --access public
      - name: npm publish skipped
        if: steps.npmcheck.outputs.exists == 'true'
        run: echo "genesis402-mcp@${{ steps.ver.outputs.version }} is already on npm; skipping"

      - name: wait until npm serves this version (the MCP Registry validates against npm)
        run: |
          for i in $(seq 1 40); do
            if npm view "genesis402-mcp@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then echo "npm serves ${{ steps.ver.outputs.version }}"; exit 0; fi
            sleep 15
          done
          echo "npm did not serve ${{ steps.ver.outputs.version }} within 10 minutes"; exit 1

      - name: install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: MCP Registry login (github-oidc) + publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: verify registry shows this version
        run: |
          for i in $(seq 1 12); do
            V=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.FTHTrading/genesis402-mcp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const hit=(j.servers||[]).map(x=>x.server||x).find(x=>x.name==="io.github.FTHTrading/genesis402-mcp"&&x.version==="'"${{ steps.ver.outputs.version }}"'");process.stdout.write(hit?hit.version:"")})')
            if [ "$V" = "${{ steps.ver.outputs.version }}" ]; then echo "registry has $V"; exit 0; fi
            sleep 10
          done
          echo "registry did not report ${{ steps.ver.outputs.version }} in time"; exit 1
